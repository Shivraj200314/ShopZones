<div class="auth-page">

  <div class="auth-card">

    <div class="logo">

      <img class="logo-icon" src="assets/shopzones-mark.svg" alt="" aria-hidden="true" />

      <span>

        {{
        revampFallback()
        ['login']
        ['brand-name']
        }}

      </span>

    </div>

    <div class="auth-content">

      <h1>

        {{
        revampFallback()
        ['login']
        ['title']
        }}

      </h1>

      <p>

        {{
        revampFallback()
        ['login']
        ['subtitle']
        }}

      </p>

      <div class="error-message" *ngIf="errorMessage">

        {{ errorMessage }}

      </div>

      <div class="form-group">

        <label>

          {{
          revampFallback()
          ['login']
          ['email-label']
          }}

        </label>

        <input type="email" [(ngModel)]="email" [placeholder]="
    revampFallback()
      ['login']
      ['email-placeholder']
  " [disabled]="isLoading" />

      </div>

      <div class="form-group">

        <label>

          {{
          revampFallback()
          ['login']
          ['password-label']
          }}

        </label>


        <input type="password" [(ngModel)]="password" [placeholder]="
    revampFallback()
      ['login']
      ['password-placeholder']
  " [disabled]="isLoading" />

      </div>

      <button type="button" class="primary-button" (click)="login()" [disabled]="isLoading">

        <span class="spinner" *ngIf="isLoading">
        </span>


        <span *ngIf="!isLoading">

          {{
          revampFallback()
          ['login']
          ['login-button']
          }}

        </span>


        <span *ngIf="isLoading">

          {{
          revampFallback()
          ['login']
          ['loading-button']
          }}

        </span>

      </button>

      <div class="auth-footer">

        <span>

          {{
          revampFallback()
          ['login']
          ['signup-text']
          }}

        </span>


        <button type="button" (click)="goToSignup()">

          {{
          revampFallback()
          ['login']
          ['signup-button']
          }}

        </button>

      </div>

    </div>

  </div>

</div>
