<form (ngSubmit)="signup()">

  <div class="form-group">
    <label>Full Name</label>

    <input type="text" [(ngModel)]="name" name="name" placeholder="Enter your full name" required />
  </div>

  <div class="form-group">
    <label>Email Address</label>

    <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required />

  </div>

  <div class="form-group">
    <label>Password</label>

    <input type="password" [(ngModel)]="password" name="password" placeholder="Create password" required />

  </div>

  <div class="form-group">
    <label>Confirm Password</label>

    <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password"
      required />

  </div>

  <button type="submit" class="signup-button" [disabled]="isLoading">
    <span *ngIf="isLoading" class="spinner"></span>

    <span *ngIf="!isLoading">
      Create Account
    </span>

    <span *ngIf="isLoading">
      Creating Account...
    </span>

  </button>

</form>
